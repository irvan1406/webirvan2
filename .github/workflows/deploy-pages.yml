name: Terbitkan Situs (GitHub Pages via Actions)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4
      - name: Siapkan Pages
        uses: actions/configure-pages@v5
      - name: Unggah situs (seluruh repo sebagai situs statis)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
