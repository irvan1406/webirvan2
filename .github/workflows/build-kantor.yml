name: Build Kantor VanX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-kantor/**"
      - ".github/workflows/build-kantor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kantor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/KantorVanX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KantorVanX-Android
          path: android-kantor/app/build/outputs/apk/debug/KantorVanX.apk
          if-no-files-found: error
